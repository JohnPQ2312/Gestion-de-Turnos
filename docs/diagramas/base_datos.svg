y="Segoe UI, sans-serif" font-size="17" font-weight="400">1</text><rect x="592" y="1272" width="32.0" height="23" fill="white" /><text x="595" y="1290" fill="#193540" font-family="Segoe UI, sans-serif" font-size="17" font-weight="400">0..*</text><text x="40" y="38" fill="#193540" font-family="Segoe UI, sans-serif" font-size="30" font-weight="600">Gestión de Turnos | Modelo relacional</text><text x="40" y="74" fill="#193540" font-family="Segoe UI, sans-serif" font-size="18" font-weight="400">Tablas y relaciones del DDL actual. PK: primaria; FK: foránea. Referencia: cc9405e.</text><text x="40" y="1690" fill="#193540" font-family="Segoe UI, sans-serif" font-size="17" font-weight="400">Cada extremo indica cuántas filas de esa tabla pueden relacionarse con una fila de la tabla opuesta.</text><text x="40" y="1720" fill="#193540" font-family="Segoe UI, sans-serif" font-size="17" font-weight="400">0..1: opcional; 1: obligatorio; 0..*: ninguna o muchas; UQ: única. El puente indica cruce sin unión.</text><text x="40" y="1750" fill="#193540" font-family="Segoe UI, sans-serif" font-size="17" font-weight="400">Una asignación puede tener muchos tickets históricos, pero solo uno LLAMADO o EN_ATENCION a la vez.</text><text x="40" y="1780" fill="#193540" font-family="Segoe UI, sans-serif" font-size="17" font-weight="400">Los campos active_* son columnas calculadas con índices únicos: no agregan relaciones foráneas.</text><text x="40" y="1810" fill="#193540" font-family="Segoe UI, sans-serif" font-size="17" font-weight="400">assignment_id es nulo solo en EN_ESPERA; user_id es opcional. Ver reglas y tipos completos en el SQL.</text></svg>