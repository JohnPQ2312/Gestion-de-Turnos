<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1080" viewBox="0 0 1500 1080"><rect width="100%" height="100%" fill="white" /><path d="M 255 234 L 255 340 L 360 340 L 360 440" stroke="#647b85" stroke-width="2" fill="none" /><polygon points="360,440 354.345448056554,428.2941876694152 365.654551943446,428.2941876694152" fill="#647b85" /><path d="M 750 234 L 750 440" stroke="#647b85" stroke-width="2" fill="none" /><polygon points="750,440 744.345448056554,428.2941876694152 755.654551943446,428.2941876694152" fill="#647b85" /><path d="M 1140 234 L 1140 440" stroke="#647b85" stroke-width="2" fill="none" /><polygon points="1140,440 1134.345448056554,428.2941876694152 1145.654551943446,428.2941876694152" fill="#647b85" /><path d="M 1290 440 L 1290 234" stroke="#647b85" stroke-width="2" fill="none" stroke-dasharray="7 5" /><polygon points="1290,234 1295.654551943446,245.7058123305848 1284.345448056554,245.7058123305848" fill="#647b85" /><path d="M 750 594 L 750 790" stroke="#647b85" stroke-width="2" fill="none" /><polygon points="750,790 744.345448056554,778.2941876694152 755.654551943446,778.2941876694152" fill="#647b85" /><rect x="50" y="130" width="410" height="104" rx="6" fill="white" stroke="#647b85" /><rect x="50" y="130" width="410" height="40" fill="#006d66" /><text x="64" y="157" fill="white" font-family="Segoe UI, sans-serif" font-size="21" font-weight="600">CostumerTurn</text><text x="64" y="195" fill="#193540" font-family="Segoe UI, sans-serif" font-size="18" font-weight="400">JavaFX / controlador / cliente de red</text><text x="64" y="220" fill="#193540" font-family="Segoe UI, sans-serif" font-size="18" font-weight="400">Catálogo y generación de turnos</text><rect x="545" y="130" width="410" height="104" rx="6" fill="white" stroke="#647b85" /><rect x="545" y="130" width="410" height="40" fill="#006d66" /><text x="559" y="157" fill="white" font-family="Segoe UI, sans-serif" font-size="21" font-weight="600">OperatorSystem</text><text x="559" y="195" fill="#193540" font-family="Segoe UI, sans-serif" font-size="18" font-weight="400">JavaFX / controladores / clientes de red</text><text x="559" y="220" fill="#193540" font-family="Segoe UI, sans-serif" font-size="18" font-weight="400">Acceso, atención y administración</text><rect x="1040" y="130" width="410" height="104" rx="6" fill="white" stroke="#647b85" /><rect x="1040" y="130" width="410" height="40" fill="#006d66" /><text x="1054" y="157" fill="white" font-family="Segoe UI, sans-serif" font-size="21" font-weight="600">QueueDisplayScreen</text><text x="1054" y="195" fill="#193540" font-family="Segoe UI, sans-serif" font-size="18" font-weight="400">JavaFX / DisplayRefreshService</text><text x="1054" y="220" fill="#193540" font-family="Segoe UI, sans-serif" font-size="18" font-weight="400">Llamados, espera y reloj</text><rect x="170" y="440" width="1160" height="154" rx="6" fill="white" stroke="#647b85" /><rect x="170" y="440" width="1160" height="40" fill="#193540" /><text x="184" y="467" fill="white" font-family="Segoe UI, sans-serif" font-size="21" font-weight="600">CoreServer</text><text x="184" y="505" fill="#193540" font-family="Segoe UI, sans-serif" font-size="18" font-weight="400">TurnServer + TurnRequestHandler: conexiones, protocolo y permisos</text><text x="184" y="530" fill="#193540" font-family="Segoe UI, sans-serif" font-size="18" font-weight="400">Servicios: generación, atención, rellamado, acceso, consultas y administración</text><text x="184" y="555" fill="#193540" font-family="Segoe UI, sans-serif" font-size="18" font-weight="400">Repositorios JDBC: SQL parametrizado, transacciones y bloqueos</text><text x="184" y="580" fill="#193540" font-family="Segoe UI, sans-serif" font-size="18" font-weight="400">DisplayEventHub: avisos posteriores a la confirmación de cambios</text><rect x="520" y="790" width="460" height="104" rx="6" fill="white" stroke="#647b85" /><rect x="520" y="790" width="460" height="40" fill="#006d66" /><text x="534" y="817" fill="white" font-family="Segoe UI, sans-serif" font-size="21" font-weight="600">MySQL 8 / InnoDB</text><text x="534" y="855" fill="#193540" font-family="Segoe UI, sans-serif" font-size="18" font-weight="400">Diez tablas, claves y restricciones</text><text x="534" y="880" fill="#193540" font-family="Segoe UI, sans-serif" font-size="18" font-weight="400">Turnos, asignaciones y credenciales</text><text x="40" y="38" fill="#193540" font-family="Segoe UI, sans-serif" font-size="30" font-weight="600">Gestión de Turnos | Componentes</text><text x="40" y="74" fill="#193540" font-family="Segoe UI, sans-serif" font-size="18" font-weight="400">Tres clientes independientes; CoreServer centraliza reglas y persistencia. Referencia: cc9405e.</text><text x="62" y="305" fill="#193540" font-family="Segoe UI, sans-serif" font-size="17" font-weight="400">Solicitudes / respuestas</text><text x="555" y="305" fill="#193540" font-family="Segoe UI, sans-serif" font-size="17" font-weight="400">Solicitudes autenticadas</text><text x="984" y="355" fill="#193540" font-family="Segoe UI, sans-serif" font-size="17" font-weight="400">Snapshot</text><text x="1300" y="350" fill="#193540" font-family="Segoe UI, sans-serif" font-size="17" font-weight="400">Avisos</text><text x="780" y="720" fill="#193540" font-family="Segoe UI, sans-serif" font-size="18" font-weight="400">JDBC: lecturas y escrituras</text><text x="40" y="965" fill="#193540" font-family="Segoe UI, sans-serif" font-size="17" font-weight="400">Líneas continuas: solicitudes y respuestas por el mismo canal; la flecha indica quién inicia la operación.</text><text x="40" y="995" fill="#193540" font-family="Segoe UI, sans-serif" font-size="17" font-weight="400">Línea discontinua: canal persistente SUBSCRIBE_DISPLAY; el aviso provoca una nueva consulta de snapshot.</text><text x="40" y="1025" fill="#193540" font-family="Segoe UI, sans-serif" font-size="17" font-weight="400">TLS obligatorio fuera de loopback. La configuración TLS de JDBC se administra por separado.</text></svg>